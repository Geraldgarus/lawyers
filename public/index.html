<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advocate Suite — Login</title>
  <style>body{opacity:0;transition:opacity .2s} body.loaded{opacity:1}</style>
  <script>document.addEventListener('DOMContentLoaded',()=>document.body.classList.add('loaded'));</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --navy: #4A1D2E; --gold: #B8935A; --cream: #F5F0E8; }
    body {
      font-family: 'Inter', sans-serif;
      background: #2b1420;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    body::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 20% 50%, rgba(184,147,90,0.18) 0%, #2b1420 70%);
      pointer-events: none;
    }
    .container { max-width: 1000px; width: 100%; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }
    .login-card { background: white; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-wrap: wrap; }
    .brand-side {
      flex: 1; background: linear-gradient(135deg, var(--navy), #2b1420);
      padding: 48px 40px; color: var(--cream);
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      min-width: 280px;
    }
    .logo-icon { font-size: 48px; margin-bottom: 18px; color: var(--gold); }
    .brand-side h1 { font-family: 'Playfair Display', serif; font-size: 26px; margin-bottom: 10px; }
    .brand-side p { font-size: 13px; opacity: 0.75; line-height: 1.5; max-width: 80%; }
    .feature-list { margin-top: 28px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
    .feature-list span { font-size: 12px; opacity: 0.85; display: flex; align-items: center; gap: 8px; }
    .feature-list i { color: var(--gold); }
    .form-side { flex: 0.85; padding: 48px 44px; min-width: 320px; background: white; }
    .form-side h2 { font-size: 26px; color: #0f172a; margin-bottom: 6px; font-weight: 700; }
    .form-side .subtitle { color: #64748b; font-size: 13px; margin-bottom: 30px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 11.5px; font-weight: 600; margin-bottom: 7px; color: #334155; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input { width: 100%; padding: 12px 15px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 14px; background: #f8fafc; transition: all .2s; }
    .form-group input:focus { outline: none; border-color: var(--gold); background: white; box-shadow: 0 0 0 3px rgba(184,147,90,0.15); }
    .btn-login { width: 100%; background: var(--gold); color: white; border: none; padding: 13px; border-radius: 30px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all .2s; margin-top: 6px; }
    .btn-login:hover { background: #a17e4c; transform: translateY(-1px); }
    .btn-login:disabled { opacity: 0.6; cursor: default; transform: none; }
    .error-message { color: #ef4444; font-size: 12px; text-align: center; margin-top: 12px; min-height: 14px; }
    @media (max-width: 768px) {
      .login-card { flex-direction: column; }
      .brand-side { padding: 32px 24px; }
      .form-side { padding: 32px 24px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-card">
      <div class="brand-side">
        <div class="logo-icon"><i class="fas fa-scale-balanced"></i></div>
        <h1>Advocate Suite</h1>
        <p>Case management for private legal practice.</p>
        <div class="feature-list">
          <span><i class="fas fa-check"></i> Clients &amp; case tracking</span>
          <span><i class="fas fa-check"></i> Court diary &amp; deadlines</span>
          <span><i class="fas fa-check"></i> Billing &amp; document management</span>
        </div>
      </div>
      <div class="form-side">
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to access your dashboard</p>
        <form id="loginForm">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>
          </div>
          <button type="submit" class="btn-login" id="submitLogin">Sign In →</button>
          <div class="error-message" id="loginError"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const submitBtn = document.getElementById('submitLogin');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';
      loginError.innerText = '';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Login failed');

        sessionStorage.setItem('token', data.token);
        sessionStorage.setItem('advocate_user', JSON.stringify({
          id: data.id, username: data.username, fullName: data.fullName,
          email: data.email, role: data.role
        }));
        window.location.href = '/dashboard';
      } catch (err) {
        loginError.innerText = err.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In →';
      }
    });
  </script>
</body>
</html>
